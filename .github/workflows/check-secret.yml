name: check secret (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length: ${#TOKEN}"
          case "$TOKEN" in sk-ant-oat*) echo "prefix: ok";; *) echo "prefix: WRONG";; esac
          case "$TOKEN" in *[[:space:]]*) echo "whitespace: yes";; *) echo "whitespace: no";; esac
