name: check secrets (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUTO: ${{ secrets.AUTOMATION_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          echo "claude length: ${#CLAUDE}"; case "$CLAUDE" in sk-ant-oat*) echo "claude prefix: ok";; *) echo "claude prefix: WRONG";; esac
          echo "github length: ${#AUTO}"; case "$AUTO" in github_pat_*) echo "github prefix: ok";; *) echo "github prefix: WRONG";; esac
          for r in AI-Video-Transcription Dr.Chat-by-NerAz FIDChain-Federated-Intrusion-Detection-System-with-Blockchain Customers-Review-Analysis AWS_SecurityAudit_CISBenchmarks Automated-AWS-Access-Management; do
            echo "github token can read $r: $(gh api repos/nerminekabadou/$r --jq '.permissions.push' 2>&1 | head -1)"
          done
