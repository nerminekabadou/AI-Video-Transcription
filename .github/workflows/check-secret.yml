name: check secret (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length: ${#TOKEN}"
          case "$TOKEN" in sk-ant-oat*) echo "prefix: looks like a Claude OAuth token";; *) echo "prefix: NOT a Claude OAuth token";; esac
          case "$TOKEN" in *[[:space:]]*) echo "contains whitespace: yes";; *) echo "contains whitespace: no";; esac
