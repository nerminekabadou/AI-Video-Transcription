name: Claude

# Claude works on an issue or PR when I comment "@claude ..." on it.
# Only my own comments trigger it (public repo: nobody else can start a run).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'nerminekabadou'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only the tools needed to change code and verify it with the project's own checks.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Bash(npm ci),Bash(npm run lint),Bash(npm run build),Bash(pip install -r requirements-dev.txt),Bash(pytest:*),Bash(git status),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*)"
